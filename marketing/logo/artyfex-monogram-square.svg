<?xml version="1.0" encoding="UTF-8"?>
<!-- ArtyFex 'Art' monogram — square. Matches the site favicon. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="ArtyFex Art monogram">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e6c98f"/>
      <stop offset="50%" stop-color="#c9a15a"/>
      <stop offset="100%" stop-color="#8c6a2f"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="512" height="512" rx="64" ry="64" fill="url(#bg)"/>
  <rect x="12" y="12" width="488" height="488" rx="56" ry="56" fill="none" stroke="url(#gold)" stroke-opacity="0.35" stroke-width="1"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#gold)" stroke-opacity="0.25" stroke-width="1"/>
  <text x="256" y="310"
        text-anchor="middle"
        font-family="'Cormorant', 'Times New Roman', serif"
        font-style="italic"
        font-weight="500"
        font-size="220"
        letter-spacing="-4"
        fill="url(#gold)">Art</text>
  <line x1="176" y1="350" x2="336" y2="350" stroke="url(#gold)" stroke-opacity="0.9" stroke-width="3" stroke-linecap="round"/>
  <text x="256" y="400"
        text-anchor="middle"
        font-family="'Outfit', 'Helvetica', sans-serif"
        font-weight="300"
        font-size="20"
        letter-spacing="14"
        fill="#c9a15a" fill-opacity="0.7">A T E L I E R</text>
</svg>
