<?xml version="1.0" encoding="UTF-8"?>
<!-- ArtyFex primary wordmark · gold on ink · print-ready -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img" aria-label="ArtyFex">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e6c98f"/>
      <stop offset="50%" stop-color="#c9a15a"/>
      <stop offset="100%" stop-color="#8c6a2f"/>
    </linearGradient>
    <radialGradient id="ink" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
  </defs>
  <rect width="720" height="240" fill="url(#ink)"/>
  <line x1="120" y1="90" x2="600" y2="90" stroke="url(#gold)" stroke-opacity="0.35" stroke-width="0.6"/>
  <text x="360" y="160"
        text-anchor="middle"
        font-family="'Cormorant', 'Times New Roman', serif"
        font-weight="500"
        font-size="104"
        letter-spacing="4"
        fill="url(#gold)">Arty<tspan font-style="italic" font-weight="400">Fex</tspan></text>
  <line x1="120" y1="178" x2="600" y2="178" stroke="url(#gold)" stroke-opacity="0.35" stroke-width="0.6"/>
  <text x="360" y="205"
        text-anchor="middle"
        font-family="'Outfit', 'Helvetica', sans-serif"
        font-weight="300"
        font-size="14"
        letter-spacing="9"
        fill="#c9a15a" fill-opacity="0.85">DECORATIVE  LUXURY  BRAND</text>
</svg>
