<?xml version="1.0" encoding="UTF-8"?>
<!-- Maskable PWA icon: safe area is inner 80% (Android will crop edges). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e6c98f"/>
      <stop offset="50%" stop-color="#c9a15a"/>
      <stop offset="100%" stop-color="#8c6a2f"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="512" height="512" fill="url(#bg)"/>
  <!-- Ornamental gold ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#goldGrad)" stroke-opacity="0.35" stroke-width="2"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#goldGrad)" stroke-opacity="0.6" stroke-width="1"/>
  <text x="256" y="298"
        text-anchor="middle"
        font-family="'Cormorant Garamond', 'Times New Roman', serif"
        font-style="italic"
        font-weight="500"
        font-size="220"
        letter-spacing="-4"
        fill="url(#goldGrad)">Art</text>
  <line x1="176" y1="340" x2="336" y2="340"
        stroke="url(#goldGrad)" stroke-opacity="0.9" stroke-width="4" stroke-linecap="round"/>
</svg>
