<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ArtyFex — Art monogram">
  <!-- Deep ink background with subtle radial glow (luxury dark theme) -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e6c98f"/>
      <stop offset="50%" stop-color="#c9a15a"/>
      <stop offset="100%" stop-color="#8c6a2f"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="0" y="0" width="64" height="64" rx="12" ry="12" fill="url(#bg)"/>
  <!-- Gold hairline border -->
  <rect x="1.2" y="1.2" width="61.6" height="61.6" rx="11" ry="11"
        fill="none" stroke="url(#goldGrad)" stroke-opacity="0.35" stroke-width="0.7"/>

  <!-- "Art" wordmark centered, luxury serif in gold gradient -->
  <text x="32" y="42"
        text-anchor="middle"
        font-family="'Cormorant Garamond', 'Times New Roman', serif"
        font-style="italic"
        font-weight="500"
        font-size="34"
        letter-spacing="-1"
        fill="url(#goldGrad)">Art</text>

  <!-- Small gold underline flourish -->
  <line x1="21" y1="49" x2="43" y2="49"
        stroke="url(#goldGrad)" stroke-opacity="0.8" stroke-width="1.1" stroke-linecap="round"/>
</svg>
