<?xml version="1.0" encoding="UTF-8"?>
<!-- ArtyFex wordmark favicon (white "Arty" + gold "Fex" on ink black) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="ArtyFex">
  <rect width="512" height="512" fill="#050505"/>
  <g font-family="'Cormorant Garamond','Instrument Serif','Playfair Display',Georgia,'Times New Roman',serif"
     font-weight="500"
     font-size="220"
     text-anchor="middle"
     dominant-baseline="middle">
    <text x="180" y="270" fill="#FFFFFF">Arty</text>
    <text x="360" y="270" fill="#F4C441" font-style="italic">Fex</text>
  </g>
</svg>
