        />
        <meta property="og:title" content="ArtyFex — Handmade Resin & Crystal Mirrors" />

            rel="stylesheet"
        />
        <title>ArtyFex — Handmade Resin & Crystal Mirrors</title>
        <script>
            window.addEventListener(
                "error",
                function (e) {
                    if (
                        e.error instanceof DOMException &&
                        e.error.name === "DataCloneError" &&
                        e.message &&
                        e.message.includes("PerformanceServerTiming")
                    ) {
                        e.stopImmediatePropagation();
                        e.preventDefault();
                    }
                },
                true,
            );
        </script>
    </head>
